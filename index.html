<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WORLD EMPIRE</title>
<style>
:root{color-scheme:dark;--bg:#081321;--panel:#122238;--panel2:#1a3049;--line:#29445f;--text:#edf5ff;--muted:#9ab0c8;--green:#43d6a0;--blue:#51a9ff;--gold:#f0c66d;--red:#ff7777}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% -15%,#1c4964 0,transparent 48%),var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.app{max-width:1250px;margin:auto;padding:18px}button,select{font:inherit}button{cursor:pointer;color:inherit}.hero{padding:22px;border:1px solid #31516e;border-radius:18px;background:linear-gradient(115deg,#102a43,#164c61 60%,#16364c);box-shadow:0 14px 50px #0005}.top,.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.eyebrow{letter-spacing:2px;font-size:10px;color:#b5cce0}.brand{font-size:clamp(27px,5vw,43px);font-weight:950;letter-spacing:2px}.sub,.muted{color:var(--muted)}.year{text-align:right}.year strong{font-size:23px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:13px 0}.stat,.panel{background:linear-gradient(145deg,#15263d,#101d2e);border:1px solid var(--line);border-radius:14px;padding:15px;min-width:0}.stat small{color:var(--muted)}.stat strong{display:block;font-size:clamp(18px,3vw,26px);margin:5px 0}.positive{color:var(--green)}.negative{color:var(--red)}.nav{display:flex;gap:7px;overflow:auto;padding:3px 0 12px}.nav button,.secondary{border:1px solid var(--line);background:#142840;color:var(--text);border-radius:9px;padding:10px 13px;white-space:nowrap}.nav button.active,.primary{background:linear-gradient(120deg,#168b9b,#2374c6);border:0;color:white;font-weight:800}.panel{margin-bottom:12px}.panel h2{font-size:16px;margin:0 0 10px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.layout{display:grid;grid-template-columns:1.35fr 1fr;gap:12px}.metric,.card{padding:11px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}.metric b{display:block;font-size:18px;margin-top:3px}.btn{border:0;border-radius:9px;padding:10px 13px;color:white;background:#167e9c;font-weight:750}.btn.gold{background:#967022}.btn.green{background:#147a5a}.btn:disabled{opacity:.4;cursor:not-allowed}.btnline{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.chart{width:100%;height:180px;display:block}.country-grid,.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px}.country{background:#172840;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px;text-align:left}.country.selected{border:2px solid var(--gold);background:#26384d}.flag{font-size:22px}.tag{font-size:10px;color:var(--muted)}.progress{height:7px;border-radius:10px;background:#263950;overflow:hidden;margin-top:6px}.progress span{height:100%;display:block;background:linear-gradient(90deg,#21bd9a,#4da3ff)}.listitem{padding:11px 0;border-bottom:1px solid var(--line)}.listitem:last-child{border:0}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{text-align:left;padding:9px 7px;border-bottom:1px solid var(--line)}.table th{color:var(--muted)}.notice{border-left:3px solid var(--gold);background:#302a1c;padding:10px;border-radius:7px;color:#f5dfb2}.map{background:#0d1b2c;border:1px solid var(--line);border-radius:12px;padding:8px}.map svg{width:100%;height:auto;display:block}.map path{fill:#285c67;stroke:#5d8790;stroke-width:1.2}.map circle{fill:#e4bd68;stroke:#fff;stroke-width:2}.footer{text-align:center;color:var(--muted);font-size:10px;padding:18px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#20354c;border:1px solid #52718d;border-radius:10px;padding:11px 16px;box-shadow:0 8px 30px #0008;z-index:5;max-width:90%;text-align:center}.hidden{display:none!important}select{display:block;width:100%;padding:10px;background:#172840;color:white;border:1px solid var(--line);border-radius:8px;margin-top:5px}
@media(max-width:760px){.app{padding:10px}.stats{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.grid3{grid-template-columns:repeat(2,1fr)}.hero{padding:16px}}
.detailed-map-wrap{position:relative;width:100%;overflow:hidden;border:1px solid #31536d;border-radius:12px;background:#071827;line-height:0}.detailed-map-wrap canvas{display:block;width:100%;height:auto;cursor:crosshair}.detailed-map-wrap svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.detailed-map-wrap .map-market-pin{pointer-events:all;cursor:pointer}.detailed-map-wrap .map-market-pin:hover circle{stroke:#fff;stroke-width:4}.map-legend{display:flex;gap:12px;flex-wrap:wrap;padding:9px 11px;background:#0c1d2e;border:1px solid var(--line);border-radius:9px;font-size:11px;color:var(--muted)}.map-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}.map-note{font-size:12px;color:var(--muted);margin:8px 2px 12px}.map-status{padding:18px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6;}.country.selected{border-color:var(--gold)}</style>
</head>
<body><main class="app">
<header class="hero"><div class="top"><div><div class="eyebrow">世界経済・企業経営シミュレーション</div><div class="brand">WORLD EMPIRE</div><div class="sub">世界規模の企業帝国を築き、市場を支配しよう</div></div><div class="year"><div class="eyebrow">会計年度</div><strong id="year">2026</strong><div class="sub" id="day">1日目</div></div></div><div class="row" style="margin-top:18px"><span class="eyebrow">世界経済</span><b id="economyText">安定</b></div><div class="progress"><span id="economyBar" style="width:55%"></span></div></header>
<section class="stats"><div class="stat"><small>現金</small><strong id="cash">$10.00M</strong><small>流動資産</small></div><div class="stat"><small>企業価値</small><strong id="valuation">$25.00M</strong><small>企業評価額</small></div><div class="stat"><small>1日の純利益</small><strong id="profit">$0</strong><small id="incomeHint">事業を始めましょう</small></div><div class="stat"><small>進出国数</small><strong id="marketCount">1</strong><small id="businessCount">企業 0社</small></div></section>
<nav class="nav" id="nav"><button class="active" data-view="overview">概要</button><button data-view="world">世界地図</button><button data-view="business">企業経営</button><button data-view="market">株式市場</button><button data-view="research">研究開発</button><button data-view="trade">物流ネットワーク</button><button data-view="ranking">ランキング</button></nav>
<div id="content"></div><div class="btnline"><button class="btn primary" id="advance">▶ 1日進める</button><button class="secondary" id="auto">自動進行：OFF</button><button class="secondary" id="save">💾 セーブ</button><button class="secondary" id="load">↩ ロード</button><button class="secondary" id="reset">新しいゲーム</button></div>
<div class="footer">WORLD EMPIRE v2.1 · 経済シミュレーション · セーブデータはこのブラウザに保存されます</div></main><div id="toast" class="toast hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-geo@3.1.1/dist/d3-geo.min.js"></script>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const money=n=>'$'+(Math.abs(n)>=1e9?(n/1e9).toFixed(2)+'B':Math.abs(n)>=1e6?(n/1e6).toFixed(2)+'M':Math.round(n).toLocaleString());
const countryNames={'Japan':'日本','United States':'アメリカ','China':'中国','Germany':'ドイツ','United Kingdom':'イギリス','India':'インド','France':'フランス','Brazil':'ブラジル','Australia':'オーストラリア','South Korea':'韓国','Canada':'カナダ','Singapore':'シンガポール'};
const countries=[
 ['Japan','🇯🇵','アジア',1.1,5e6],['United States','🇺🇸','北アメリカ',1.5,12e6],['China','🇨🇳','アジア',1.35,9e6],
 ['Germany','🇩🇪','ヨーロッパ',1.2,6.5e6],['United Kingdom','🇬🇧','ヨーロッパ',1.15,6e6],['India','🇮🇳','アジア',1.25,4.5e6],
 ['France','🇫🇷','ヨーロッパ',1.05,5.2e6],['Brazil','🇧🇷','南アメリカ',.95,3.8e6],['Australia','🇦🇺','オセアニア',1.05,4.2e6],
 ['South Korea','🇰🇷','アジア',1.1,4.8e6],['Canada','🇨🇦','北アメリカ',1.08,5e6],['Singapore','🇸🇬','アジア',1.3,4e6]
];
const sectors=[
 {id:'manufacturing',name:'製造業',icon:'🏭',cost:3.5e6,income:180000},
 {id:'technology',name:'テクノロジー',icon:'💻',cost:5e6,income:280000},
 {id:'logistics',name:'物流',icon:'🚢',cost:2.8e6,income:150000},
 {id:'property',name:'不動産',icon:'🏢',cost:4.2e6,income:190000},
 {id:'energy',name:'エネルギー',icon:'⚡',cost:6e6,income:310000}
];
const tech=[
 {id:'automation',name:'高度自動化',cost:1.5e6,desc:'製造業の収益 +25%'},
 {id:'ai',name:'AI経営管理',cost:2.5e6,desc:'全事業の収益 +15%'},
 {id:'globalLogistics',name:'国際物流',cost:3e6,desc:'貿易ルートの収益 +40%'},
 {id:'finance',name:'金融工学',cost:4e6,desc:'企業価値 +20%'},
 {id:'materials',name:'次世代素材',cost:6e6,desc:'製造業の収益 +30%'},
 {id:'quantum',name:'量子コンピューター',cost:10e6,desc:'テクノロジー事業の収益 +35%'}
];
const transport={
 ship:{name:'船便',icon:'🚢',cost:1.5e6,income:120000,days:4,duration:17},
 air:{name:'航空便',icon:'✈️',cost:2.8e6,income:220000,days:1,duration:9},
 land:{name:'陸路',icon:'🚚',cost:.9e6,income:80000,days:2,duration:12}
};
const landPairs=['United States|Canada','Germany|France','Germany|United Kingdom','France|United Kingdom'];
const isoMarket={'392':'Japan','840':'United States','156':'China','276':'Germany','826':'United Kingdom','356':'India','250':'France','076':'Brazil','036':'Australia','410':'South Korea','124':'Canada','702':'Singapore'};
const marketLonLat={'Japan':[138,36],'United States':[-98,39],'China':[103,35],'Germany':[10.5,51],'United Kingdom':[-3,55],'India':[78,22],'France':[2,46],'Brazil':[-52,-10],'Australia':[134,-25],'South Korea':[127.5,36],'Canada':[-106,56],'Singapore':[103.8,1.3]};
const fresh=()=>({
 cash:1e7,day:1,year:2026,economy:55,selected:'Japan',markets:['Japan'],businesses:[],routes:[],research:[],
 stocks:[100,102,99,105,103,108,110,107],history:[25],profit:0,shares:0,sharePrice:100000,
 countryEconomy:Object.fromEntries(countries.map((n,i)=>[n[0],43+((i*17+23)%31)])),
 news:'WORLD EMPIRE INC.を東京に設立しました。最初の事業を始めましょう。',
 rivals:[
  {name:'NOVA GLOBAL',sector:'テクノロジー',value:42e6},
  {name:'APEX INDUSTRIES',sector:'製造業',value:31e6},
  {name:'ORBITAL LOGISTICS',sector:'物流',value:18e6},
  {name:'SUMMIT CAPITAL',sector:'金融',value:55e6},
  {name:'PACIFIC DYNAMICS',sector:'エネルギー',value:26e6}
 ],
 routeFromDraft:'Japan',routeToDraft:'',routeModeDraft:'ship'
});
let s=fresh(),timer=null,current='overview',worldFeatures=null,worldPromise=null,worldProjection=null,worldHits=[];
const notify=message=>{const el=$('toast');if(!el)return;el.textContent=message;el.classList.remove('hidden');clearTimeout(notify.timer);notify.timer=setTimeout(()=>el.classList.add('hidden'),2800);};
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const valBase=()=>25e6+s.businesses.reduce((a,b)=>a+b.cost*1.15,0)+s.routes.length*1.2e6+s.research.length*1.5e6;
const val=()=>valBase()+(s.research.includes('finance')?valBase()*.2:0);
const countryMood=name=>s.countryEconomy[name]||50;
const businessIncome=()=>s.businesses.reduce((sum,b)=>sum+b.income*(countryMood(b.country)/50),0);
const routeIncome=()=>s.routes.reduce((sum,r)=>sum+r.income,0);
const expenses=()=>s.businesses.length*25000+s.routes.length*15000;
function stats(){
 const p=businessIncome()+routeIncome()-expenses();
 $('year').textContent=s.year;$('day').textContent=s.day+'日目';
 $('cash').textContent=money(s.cash);$('valuation').textContent=money(val());$('profit').textContent=money(p);
 $('profit').className=p>=0?'positive':'negative';
 $('incomeHint').textContent='売上 '+money(businessIncome()+routeIncome())+' / 日';
 $('marketCount').textContent=s.markets.length;$('businessCount').textContent=s.businesses.length+'社';
 $('economyText').textContent=s.economy>70?'好景気':s.economy<32?'不況':'安定';
 $('economyBar').style.width=s.economy+'%';
}
function chart(){
 const c=$('chart');if(!c)return;const x=c.getContext('2d');if(!x)return;
 const w=c.width=Math.max(320,c.clientWidth*2),h=300,a=s.stocks.slice(-24),lo=Math.min(...a)-5,hi=Math.max(...a)+5;
 x.clearRect(0,0,w,h);x.strokeStyle='#29435c';
 for(let i=1;i<4;i++){x.beginPath();x.moveTo(0,h*i/4);x.lineTo(w,h*i/4);x.stroke();}
 x.beginPath();a.forEach((v,i)=>{const px=i*w/(a.length-1),py=h-18-(v-lo)/(hi-lo)*(h-36);i?x.lineTo(px,py):x.moveTo(px,py);});
 x.strokeStyle='#39d6a0';x.lineWidth=5;x.stroke();x.lineTo(w,h);x.lineTo(0,h);x.closePath();x.fillStyle='rgba(57,214,160,.13)';x.fill();
}
function panel(title,body){return '<section class="panel"><h2>'+title+'</h2>'+body+'</section>';}
function portfolio(){
 if(!s.businesses.length)return '<div class="muted">まだ企業がありません。工場やテクノロジー企業を設立しましょう。</div>';
 return s.businesses.map(b=>'<div class="listitem row"><div><b>'+b.icon+' '+esc(b.name)+'</b><div class="muted">'+(countryNames[b.country]||b.country)+' · レベル '+(b.level||1)+'</div></div><div style="text-align:right"><b class="positive">'+money(b.income)+'/日</b><div class="tag">投資額 '+money(b.cost)+'</div></div></div>').join('');
}
function overview(){
 $('content').innerHTML='<div class="layout"><div>'+
 panel('企業業績','<div class="grid2"><div class="metric"><small class="muted">世界市場シェア</small><b>'+(0.1+s.businesses.length*.08).toFixed(2)+'%</b></div><div class="metric"><small class="muted">研究開発レベル</small><b>'+s.research.length+' / '+tech.length+'</b></div></div><canvas class="chart" id="chart"></canvas><div class="muted">株価指数 · 日ごとの変化</div>')+
 panel('企業ポートフォリオ',portfolio())+'</div><div>'+
 panel('クイック投資','<div class="cards">'+sectors.map((a,i)=>'<div class="card"><div style="font-size:22px">'+a.icon+'</div><b>'+a.name+'</b><div class="tag">投資額 '+money(a.cost)+'</div><button class="btn" style="margin-top:9px;width:100%" data-build="'+i+'">投資する</button></div>').join('')+'</div>')+
 panel('市場情報','<div class="notice">'+esc(s.news)+'</div><div class="listitem row"><span class="muted">世界経済指数</span><b>'+s.economy.toFixed(1)+'/100</b></div><div class="listitem row"><span class="muted">稼働中の物流ルート</span><b>'+s.routes.length+'</b></div><div class="listitem row"><span class="muted">ライバル企業</span><b>'+s.rivals.length+'社</b></div>')+'</div></div>';
 chart();
}
function loadWorldData(){
 if(worldFeatures)return Promise.resolve(worldFeatures);
 if(worldPromise)return worldPromise;
 if(!window.topojson||!window.d3||!window.d3.geoNaturalEarth1)return Promise.reject(new Error('地図ライブラリが読み込まれていません'));
 worldPromise=fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json')
  .then(r=>{if(!r.ok)throw new Error('地図データを取得できません');return r.json();})
  .then(topology=>{worldFeatures=topojson.feature(topology,topology.objects.countries).features;return worldFeatures;});
 return worldPromise;
}
function mapOverlay(svgId,showRoutes){
 const svg=$(svgId);if(!svg||!worldProjection)return;
 const project=name=>marketLonLat[name]?worldProjection(marketLonLat[name]):[700,325];
 let out='';
 if(showRoutes){
  s.routes.forEach(r=>{
   const a=project(r.from),b=project(r.to),mode=transport[r.mode]||transport.ship,mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2-40;
   const path='M'+a[0].toFixed(1)+' '+a[1].toFixed(1)+' Q'+mx.toFixed(1)+' '+my.toFixed(1)+' '+b[0].toFixed(1)+' '+b[1].toFixed(1);
   out+='<path d="'+path+'" fill="none" stroke="#f4c86d" stroke-width="3" stroke-dasharray="9 7" opacity=".9"/>';
   out+='<text font-size="25" text-anchor="middle" dominant-baseline="central"><animateMotion dur="'+mode.duration+'s" repeatCount="indefinite" rotate="auto" path="'+path+'"/>'+mode.icon+'</text>';
  });
 }
 s.markets.forEach(name=>{
  const p=project(name),country=countries.find(x=>x[0]===name);
  out+='<g transform="translate('+p[0].toFixed(1)+' '+p[1].toFixed(1)+')"><circle r="11" fill="'+(s.selected===name?'#e8bd61':'#238f91')+'" stroke="#fff" stroke-width="2.5"/><text text-anchor="middle" y="5" font-size="14">'+(country?country[1]:'•')+'</text><text text-anchor="middle" y="-17" font-size="13" font-weight="700" fill="#fff" stroke="#071827" stroke-width="3" paint-order="stroke">'+(country?countryNames[name]:name)+'</text></g>';
 });
 svg.innerHTML=out;
}
function drawDetailedMap(canvasId,overlayId,logisticsMode){
 const canvas=$(canvasId);if(!canvas)return;
 const status=$(canvasId+'Status');if(status)status.textContent='詳細な国境データを読み込んでいます…';
 loadWorldData().then(features=>{
  const ctx=canvas.getContext('2d');if(!ctx)return;
  const W=1400,H=650;canvas.width=W;canvas.height=H;
  const projection=d3.geoNaturalEarth1().fitSize([W,H],{type:'Sphere'});worldProjection=projection;
  const path=d3.geoPath(projection),ocean=ctx.createLinearGradient(0,0,0,H);
  ocean.addColorStop(0,'#0a2940');ocean.addColorStop(1,'#061827');ctx.fillStyle=ocean;ctx.fillRect(0,0,W,H);
  ctx.beginPath();path.context(ctx)({type:'Sphere'});ctx.fillStyle='#0b263b';ctx.fill();
  ctx.beginPath();path.context(ctx)(d3.geoGraticule10());ctx.strokeStyle='rgba(110,166,190,.2)';ctx.lineWidth=1;ctx.stroke();
  worldHits=[];
  const selectedId=Object.keys(isoMarket).find(id=>isoMarket[id]===s.selected);
  features.forEach(feature=>{
   if(!feature.geometry)return;
   const id=String(feature.id||'').padStart(3,'0'),market=isoMarket[id],d=path(feature);if(!d)return;
   const shape=new Path2D(d);
   if(id===selectedId)ctx.fillStyle='#d7ac54';
   else if(market&&s.markets.includes(market))ctx.fillStyle='#238b85';
   else if(market)ctx.fillStyle='#397b7d';
   else{const palette=['#426e66','#4b766d','#3c6866','#51796c','#3c6570'];ctx.fillStyle=palette[(parseInt(id,10)||0)%palette.length];}
   ctx.fill(shape,'evenodd');ctx.strokeStyle='rgba(190,220,215,.8)';ctx.lineWidth=1.15;ctx.stroke(shape);
   worldHits.push({market:market||null,path:shape});
  });
  mapOverlay(overlayId,logisticsMode);
  if(status)status.textContent='国境線データ：Natural Earth 1:50m · 世界の国々を表示';
  canvas.onclick=e=>{
   const rect=canvas.getBoundingClientRect(),x=(e.clientX-rect.left)*W/rect.width,y=(e.clientY-rect.top)*H/rect.height;
   const hit=worldHits.slice().reverse().find(h=>ctx.isPointInPath(h.path,x,y));if(!hit)return;
   if(!hit.market){notify('この国はまだ経営対象外です。現在は12か国でプレイできます。');return;}
   if(logisticsMode){
    if(!s.markets.includes(hit.market)){notify('この国へ先に進出してください。');return;}
    if(!s.routeFromDraft||s.routeToDraft){s.routeFromDraft=hit.market;s.routeToDraft='';}
    else if(hit.market!==s.routeFromDraft)s.routeToDraft=hit.market;
    trade();
   }else{s.selected=hit.market;show('world');}
  };
 }).catch(err=>{
  if(status)status.textContent='詳細地図を読み込めませんでした。ネット接続を確認して再読み込みしてください。';
  console.warn('WORLD EMPIRE map:',err);
 });
}
function world(){
 const c=countries.find(x=>x[0]===s.selected)||countries[0],m=s.countryEconomy[c[0]]||50;
 $('content').innerHTML=panel('詳細な世界地図 · 国をクリックして選択',
 '<div class="detailed-map-wrap"><canvas id="worldCanvas" aria-label="国境線付き世界地図"></canvas><svg id="worldOverlay" viewBox="0 0 1400 650" preserveAspectRatio="none" aria-label="進出済みの国の拠点"></svg></div><div class="map-status" id="worldCanvasStatus">詳細な世界地図を読み込んでいます…</div><div class="map-legend"><span><i class="map-dot" style="background:#d7ac54"></i>選択中</span><span><i class="map-dot" style="background:#238b85"></i>進出済み</span><span><i class="map-dot" style="background:#426e66"></i>その他の国</span><span>国境線：Natural Earth 1:50m</span></div><p class="map-note">地図上の国をクリックすると選択できます。現在、経営・進出に対応している国は12か国です。</p>'+
 '<div class="grid3"><div class="metric"><small class="muted">進出国</small><b>'+s.markets.length+'/12</b></div><div class="metric"><small class="muted">世界経済指数</small><b>'+s.economy.toFixed(1)+'/100</b></div><div class="metric"><small class="muted">景気見通し</small><b>'+(s.economy>65?'好景気':s.economy<35?'景気後退':'安定')+'</b></div></div>'+
 '<div class="country-grid" style="margin-top:12px">'+countries.map(n=>'<button class="country '+(s.selected===n[0]?'selected':'')+'" data-country="'+n[0]+'"><div class="flag">'+n[1]+'</div><b>'+countryNames[n[0]]+'</b><div class="tag">'+n[2]+' · '+(s.markets.includes(n[0])?'進出済み':'未進出')+'</div><div class="tag">景気指数 '+(s.countryEconomy[n[0]]||50)+'/100</div><div class="progress"><span style="width:'+(s.countryEconomy[n[0]]||50)+'%"></span></div></button>').join('')+'</div>')+
 panel('選択した国の市場情報','<div class="row"><div><div style="font-size:23px">'+c[1]+' '+countryNames[c[0]]+'</div><div class="muted">'+c[2]+' · 市場ポテンシャル '+c[3].toFixed(2)+'</div></div><b>'+money(c[4])+'</b></div><div class="grid3" style="margin:12px 0"><div class="metric"><small class="muted">景気</small><b>'+m+'/100</b></div><div class="metric"><small class="muted">需要</small><b>'+(m>65?'高い':m<35?'低い':'通常')+'</b></div><div class="metric"><small class="muted">見通し</small><b class="'+(m>=50?'positive':'negative')+'">'+(m>=50?'成長中':'低迷')+'</b></div></div><p class="muted">各国の景気は、その国で活動する企業の収益に影響します。</p><button class="btn" data-enter="'+c[0]+'" '+(s.markets.includes(c[0])?'disabled':'')+'>'+(s.markets.includes(c[0])?'進出済み':'この国に進出する · '+money(c[4]))+'</button>');
 drawDetailedMap('worldCanvas','worldOverlay',false);
}
function build(i){
 const a=sectors[i],c=countries.find(x=>x[0]===s.selected)||countries[0],cost=a.cost*c[3];
 if(s.cash<cost){notify('資金が足りません。必要額：'+money(cost));return;}
 let bonus=1;
 if(s.research.includes('ai'))bonus+=.15;
 if(s.research.includes('automation')&&a.id==='manufacturing')bonus+=.25;
 if(s.research.includes('materials')&&a.id==='manufacturing')bonus+=.3;
 if(s.research.includes('quantum')&&a.id==='technology')bonus+=.35;
 s.cash-=cost;s.businesses.push({name:a.name,sector:a.name,icon:a.icon,country:s.selected,cost,income:a.income*c[3]*bonus,level:1,employees:12});
 s.news=countryNames[s.selected]+'に'+a.name+'企業を設立しました。';stats();show('business');
}
function businesses(){
 $('content').innerHTML=panel('企業ポートフォリオ · 経営管理',s.businesses.length?s.businesses.map((b,i)=>'<div class="listitem"><div class="row"><div><b>'+b.icon+' '+esc(b.name||b.sector)+'</b><div class="muted">'+(countryNames[b.country]||b.country)+' · レベル '+(b.level||1)+' · 従業員 '+(b.employees||12)+'人</div></div><div style="text-align:right"><b class="positive">'+money(b.income)+'/日</b><div class="tag">企業価値 '+money(b.cost*1.15)+'</div></div></div><div class="btnline"><button class="btn" data-upgrade-business="'+i+'">強化 · '+money(Math.max(500000,b.cost*.35*(b.level||1)))+'</button><button class="secondary" data-close-business="'+i+'">売却</button></div></div>').join(''):'<div class="muted">まだ企業がありません。下から事業を設立しましょう。</div>')+
 panel('新しい事業を設立','<div class="muted">設立先：'+countryNames[s.selected]+' · 現地の景気は収益に影響します。</div><div class="grid2" style="margin-top:10px">'+sectors.map((a,i)=>'<div class="card"><div style="font-size:23px">'+a.icon+'</div><b>'+a.name+'</b><div class="tag">投資額 '+money(a.cost*(countries.find(x=>x[0]===s.selected)||countries[0])[3])+' · 売上 '+money(a.income)+'/日</div><button class="btn" style="margin-top:9px" data-build="'+i+'">事業を設立</button></div>').join('')+'</div>');
}
function market(){
 const price=s.sharePrice||100000,daily=(s.stocks[s.stocks.length-1]-s.stocks[s.stocks.length-2])/s.stocks[s.stocks.length-2]*100;
 $('content').innerHTML=panel('世界株式市場 · 自社株式 WEI','<div class="row"><div><div class="muted">WEI · 仮想株価</div><div style="font-size:31px;font-weight:850">'+money(price)+'</div></div><div class="'+(daily>=0?'positive':'negative')+'">'+(daily>=0?'▲':'▼')+' '+Math.abs(daily).toFixed(2)+'%</div></div><canvas class="chart" id="chart"></canvas><div class="grid3"><div class="metric"><small class="muted">保有株数</small><b>'+s.shares.toLocaleString()+'株</b></div><div class="metric"><small class="muted">保有株評価額</small><b>'+money(s.shares*price)+'</b></div><div class="metric"><small class="muted">企業価値</small><b>'+money(val())+'</b></div></div><div class="btnline"><button class="btn green" data-shares="buy">10株購入 · '+money(price*10)+'</button><button class="secondary" data-shares="sell" '+(s.shares<10?'disabled':'')+'>10株売却</button></div>')+
 panel('ライバル企業 · 買収と競争','<table class="table"><thead><tr><th>企業名</th><th>企業価値</th><th>操作</th></tr></thead><tbody>'+s.rivals.map((r,i)=>'<tr><td><b>'+esc(r.name)+'</b><div class="tag">'+r.sector+'</div></td><td>'+money(r.value)+'</td><td><button class="btn gold" data-acquire="'+i+'">買収 · '+money(r.value*1.2)+'</button></td></tr>').join('')+'</tbody></table><p class="muted">買収費用は推定企業価値の120%。買収企業はグループ会社になり、毎日収益を生みます。</p>');
 chart();
}
function researchView(){
 $('content').innerHTML=panel('研究開発 · 技術ツリー','<div class="muted">技術投資で会社全体の競争力を高めましょう。</div><div class="progress"><span style="width:'+s.research.length/tech.length*100+'%"></span></div>'+tech.map((t,i)=>'<div class="listitem"><div class="row"><b>🔬 '+t.name+'</b><b>'+(s.research.includes(t.id)?'<span class="positive">研究完了</span>':money(t.cost))+'</b></div><div class="muted">'+t.desc+'</div><button class="btn" style="margin-top:8px" data-tech="'+i+'" '+(s.research.includes(t.id)?'disabled':'')+'>'+(s.research.includes(t.id)?'完了':'研究に投資')+'</button></div>').join(''));
}
function routeMap(){
 return '<div class="detailed-map-wrap"><canvas id="tradeCanvas" aria-label="詳細な物流ルート地図"></canvas><svg id="tradeOverlay" viewBox="0 0 1400 650" preserveAspectRatio="none" aria-label="移動中の乗り物"></svg></div><div class="map-status" id="tradeCanvasStatus">詳細な世界地図を読み込んでいます…</div><div class="map-legend"><span><i class="map-dot" style="background:#d7ac54"></i>選択中</span><span><i class="map-dot" style="background:#238b85"></i>進出済み</span><span>🚢 船便　✈️ 航空便　🚚 陸路</span></div>';
}
function trade(){
 const from=s.routeFromDraft||'Japan',to=s.routeToDraft||'';
 const routeList=s.routes.length?s.routes.map(r=>{const m=transport[r.mode]||transport.ship;return '<div class="listitem"><div class="row"><b>'+m.icon+' '+countryNames[r.from]+' → '+countryNames[r.to]+'</b><b class="positive">'+money(r.income)+'/日</b></div><div class="muted">'+m.name+' · 所要時間：約'+m.days+'日 · 運行中</div></div>';}).join(''):'<div class="muted">物流ルートはまだありません。地図上で出発地と目的地を選びましょう。</div>';
 $('content').innerHTML=panel('世界物流ネットワーク · リアルタイム運行',routeMap()+
 '<div class="grid2" style="margin-top:10px"><div class="metric"><small class="muted">出発地</small><b>'+(countryNames[from]||'未選択')+'</b><small>進出済みの拠点</small></div><div class="metric"><small class="muted">目的地</small><b>'+(countryNames[to]||'地図から選択')+'</b><small>進出済みの拠点</small></div></div><p class="muted">地図上の国をクリック。1回目で出発地、2回目で目的地を指定できます。</p>'+
 '<div class="grid3"><button class="country '+(s.routeModeDraft==='ship'?'selected':'')+'" data-mode="ship"><div class="flag">🚢</div><b>船便</b><div class="tag">費用 $1.5M · 4日</div></button><button class="country '+(s.routeModeDraft==='air'?'selected':'')+'" data-mode="air"><div class="flag">✈️</div><b>航空便</b><div class="tag">費用 $2.8M · 1日</div></button><button class="country '+(s.routeModeDraft==='land'?'selected':'')+'" data-mode="land"><div class="flag">🚚</div><b>陸路</b><div class="tag">費用 $0.9M · 2日</div></button></div>'+
 '<div class="btnline"><button class="btn green" id="createRoute" '+(!to||from===to?'disabled':'')+'>物流ルートを開設</button><button class="secondary" id="resetRouteDraft">選択をリセット</button></div>')+
 panel('運行中の物流ルート',routeList)+
 panel('輸送方式','<div class="listitem">🚢 <b>船便</b>：大量輸送向け。基本収益 '+money(transport.ship.income)+'/日</div><div class="listitem">✈️ <b>航空便</b>：高速輸送向け。基本収益 '+money(transport.air.income)+'/日</div><div class="listitem">🚚 <b>陸路</b>：隣接国向け。基本収益 '+money(transport.land.income)+'/日</div>');
 drawDetailedMap('tradeCanvas','tradeOverlay',true);
}
function ranking(){
 const all=[{name:'WORLD EMPIRE INC.',value:val(),you:true},...s.rivals.map(r=>({name:r.name,value:r.value}))].sort((a,b)=>b.value-a.value),max=all[0].value;
 $('content').innerHTML=panel('世界企業ランキング',all.map((r,i)=>'<div class="listitem row"><div style="min-width:0;flex:1"><b>#'+(i+1)+' '+esc(r.name)+(r.you?' ★':'')+'</b><div class="progress"><span style="width:'+Math.max(3,r.value/max*100)+'%"></span></div></div><b>'+money(r.value)+'</b></div>').join(''))+
 panel('企業帝国の実績','<div class="grid2"><div class="metric"><small class="muted">進出国数</small><b>'+s.markets.length+'/12</b></div><div class="metric"><small class="muted">保有企業数</small><b>'+s.businesses.length+'</b></div><div class="metric"><small class="muted">物流ルート</small><b>'+s.routes.length+'</b></div><div class="metric"><small class="muted">研究完了</small><b>'+s.research.length+'/'+tech.length+'</b></div></div>');
}
function show(view){
 current=view;
 document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
 const views={overview,world,business:businesses,market,research:researchView,trade,ranking};
 (views[view]||overview)();
}
function advance(){
 const p=businessIncome()+routeIncome()-expenses();s.profit=p;s.cash+=p;
 s.day++;if(s.day>365){s.day=1;s.year++;}
 s.economy=Math.max(12,Math.min(95,s.economy+(Math.random()-.49)*3.5));
 countries.forEach(n=>{const old=countryMood(n[0]);s.countryEconomy[n[0]]=Math.max(12,Math.min(96,old+(Math.random()-.49)*5+(s.economy-50)*.018));});
 s.rivals.forEach(r=>{const growth=(Math.random()-.43)*.018+(s.economy-50)/9000;r.value=Math.max(4e6,r.value*(1+growth));});
 const change=(Math.random()-.47)*2.4+(s.economy-50)*.025+(p/Math.max(val(),1))*180;
 s.stocks.push(Math.max(30,s.stocks[s.stocks.length-1]+change));if(s.stocks.length>40)s.stocks.shift();
 s.sharePrice=Math.max(1000,100000*s.stocks[s.stocks.length-1]/100);s.history.push(val());
 s.news='第'+s.day+'日：世界経済指数 '+s.economy.toFixed(1)+'。営業利益 '+money(p)+'。ライバル企業も投資を続けています。';
 stats();show(current);
}
function saveGame(){try{localStorage.setItem('worldEmpireSave',JSON.stringify(s));notify('ゲームを保存しました。');}catch(e){notify('保存できませんでした。');}}
function loadGame(){
 const raw=localStorage.getItem('worldEmpireSave');if(!raw){notify('セーブデータがありません。');return;}
 try{
  const loaded=JSON.parse(raw);s={...fresh(),...loaded,auto:false};
  s.countryEconomy ||= fresh().countryEconomy;s.shares ||= 0;s.sharePrice ||= 100000;
  s.businesses.forEach(b=>{b.level ||= 1;b.employees ||= 12;b.name ||= b.sector;});
  s.routes=s.routes.map(r=>({...r,mode:r.mode||'ship',income:r.income||transport.ship.income}));
  stopAuto();stats();show(current);notify('セーブデータを読み込みました。');
 }catch(e){notify('セーブデータを読み込めませんでした。');}
}
function stopAuto(){if(timer)clearInterval(timer);timer=null;$('auto').textContent='自動進行：OFF';}
$('nav').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b)show(b.dataset.view);});
$('content').addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.country){s.selected=b.dataset.country;show('world');}
 else if(b.dataset.enter){
  const c=countries.find(x=>x[0]===b.dataset.enter);
  if(c&&s.cash>=c[4]){s.cash-=c[4];if(!s.markets.includes(c[0]))s.markets.push(c[0]);s.news=countryNames[c[0]]+'への進出に成功しました。';stats();show('world');}
  else notify('市場進出に必要な資金が足りません。');
 }
 else if(b.dataset.build!==undefined)build(+b.dataset.build);
 else if(b.dataset.tech!==undefined){
  const t=tech[+b.dataset.tech];if(s.cash<t.cost){notify('研究開発に必要な資金が足りません。');return;}
  s.cash-=t.cost;s.research.push(t.id);s.news='研究完了：'+t.name;stats();show('research');
 }
 else if(b.dataset.acquire!==undefined){
  const i=+b.dataset.acquire,r=s.rivals[i];if(!r)return;const cost=r.value*1.2;
  if(s.cash<cost){notify('買収に必要な資金が足りません。');return;}
  s.cash-=cost;s.businesses.push({name:r.name+' 子会社',sector:r.sector,icon:'🏢',country:'Global',cost,income:Math.max(70000,r.value*.009),level:1,employees:30});
  s.news=r.name+'の買収が完了しました。';s.rivals.splice(i,1);stats();show('market');
 }
 else if(b.dataset.upgradeBusiness!==undefined){
  const x=s.businesses[+b.dataset.upgradeBusiness];if(!x)return;const cost=Math.max(500000,x.cost*.35*(x.level||1));
  if(s.cash<cost){notify('強化に必要な資金が足りません。');return;}
  s.cash-=cost;x.level=(x.level||1)+1;x.employees=(x.employees||12)+8;x.cost+=cost;x.income*=1.22;stats();show('business');
 }
 else if(b.dataset.closeBusiness!==undefined){
  const i=+b.dataset.closeBusiness,x=s.businesses[i];if(!x)return;
  s.cash+=x.cost*.5;s.businesses.splice(i,1);stats();show('business');notify('事業を売却しました。');
 }
 else if(b.dataset.shares){
  const price=s.sharePrice||100000;
  if(b.dataset.shares==='buy'){const cost=price*10;if(s.cash<cost){notify('株式を購入する資金が足りません。');return;}s.cash-=cost;s.shares+=10;notify('10株購入しました。');}
  else{if(s.shares<10)return;s.cash+=price*10;s.shares-=10;notify('10株売却しました。');}
  stats();show('market');
 }
 else if(b.dataset.mode){s.routeModeDraft=b.dataset.mode;trade();}
 else if(b.id==='resetRouteDraft'){s.routeFromDraft='';s.routeToDraft='';trade();}
 else if(b.id==='createRoute'){
  const from=s.routeFromDraft,to=s.routeToDraft,mode=s.routeModeDraft||'ship',cfg=transport[mode];
  if(!from||!to||from===to){notify('出発地と目的地を選んでください。');return;}
  if(mode==='land'&&!landPairs.includes(from+'|'+to)&&!landPairs.includes(to+'|'+from)){notify('陸路は現在、隣接する国同士でのみ開設できます。');return;}
  if(s.routes.some(r=>r.from===from&&r.to===to&&r.mode===mode)){notify('同じ物流ルートがすでにあります。');return;}
  if(s.cash<cfg.cost){notify('開設に必要な資金が足りません。');return;}
  s.cash-=cfg.cost;s.routes.push({from,to,mode,income:cfg.income*(s.research.includes('globalLogistics')?1.4:1),days:cfg.days});
  s.news=countryNames[from]+'から'+countryNames[to]+'への'+cfg.name+'を開設しました。';s.routeToDraft='';stats();show('trade');notify('物流ルートを開設しました！');
 }
});
$('advance').onclick=advance;
$('auto').onclick=()=>{if(timer){stopAuto();}else{timer=setInterval(advance,1800);$('auto').textContent='自動進行：ON';}};
$('save').onclick=saveGame;$('load').onclick=loadGame;
$('reset').onclick=()=>{if(confirm('新しい会社を設立しますか？保存していない進行状況は失われます。')){stopAuto();s=fresh();stats();show('overview');notify('新しい企業帝国が始まります。');}};
stats();show('overview');
})();
</script></body></html>
