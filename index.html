<script>
(function(){
 function loadOne(urls,check){
  return new Promise((resolve,reject)=>{
   let index=0,lastError=null;
   function next(){
    if(check()){resolve();return;}
    if(index>=urls.length){reject(lastError||new Error('地図ライブラリを読み込めませんでした'));return;}
    const script=document.createElement('script');
    script.src=urls[index++];script.async=true;script.crossOrigin='anonymous';
    script.onload=()=>check()?resolve():(lastError=new Error('ライブラリ機能を確認できません'),script.remove(),next());
    script.onerror=()=>{lastError=new Error('読み込み失敗：'+script.src);script.remove();next();};
    document.head.appendChild(script);
   }
   next();
  });
 }
 window.__worldMapLibraries=Promise.all([
  loadOne([
   'https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js',
   'https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js',
   'https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js'
  ],()=>!!window.topojson),
  loadOne([
   'https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js',
   'https://unpkg.com/d3@7.9.0/dist/d3.min.js',
   'https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js'
  ],()=>!!(window.d3&&window.d3.geoNaturalEarth1&&window.d3.geoPath))
 ]).catch(error=>{window.__worldMapLibraryError=error;throw error;});
})();

async function fetchJsonFallback(urls,label){
 const failures=[];
 for(const url of urls){
  try{
   const response=await fetch(url,{mode:'cors',cache:'no-store'});
   if(!response.ok)throw new Error('HTTP '+response.status);
   return await response.json();
  }catch(error){failures.push(url+' ('+error.message+')');}
 }
 throw new Error(label+'を取得できませんでした。試した配信先：'+failures.join(' / '));
}

function drawDetailedMap(canvasId,overlayId,logisticsMode){

 const status=$(canvasId+'Status');if(status)status.textContent='詳細な国境データを読み込んでいます…';
 loadWorldData().then(features=>{
  const ctx=canvas.getContext('2d');if(!ctx)return;
  const W=1400,H=650;canvas.width=W;canvas.height=H;
  const projection=d3.geoNaturalEarth1().fitSize([W,H],{type:'Sphere'});worldProjection=projection;
  const path=d3.geoPath(projection),ocean=ctx.createLinearGradient(0,0,0,H);
  ocean.addColorStop(0,'#0a2940');ocean.addColorStop(1,'#061827');ctx.fillStyle=ocean;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#0b263b';ctx.fill(new Path2D(path({type:'Sphere'})));
  ctx.strokeStyle='rgba(110,166,190,.2)';ctx.lineWidth=1;ctx.stroke(new Path2D(path(d3.geoGraticule10())));
  worldHits=[];
  const selectedId=Object.keys(isoMarket).find(id=>isoMarket[id]===s.selected);
  features.forEach(feature=>{
   if(!feature.geometry)return;
   const id=String(feature.id||'').padStart(3,'0'),market=isoMarket[id],d=path(feature);if(!d)return;
   const shape=new Path2D(d);
   if(market)worldCountryCentroids[market]=d3.geoCentroid(feature);
   if(id===selectedId)ctx.fillStyle='#d7ac54';
   else if(market&&s.markets.includes(market))ctx.fillStyle='#238b85';
   else if(market)ctx.fillStyle='#397b7d';
   else{const palette=['#426e66','#4b766d','#3c6866','#51796c','#3c6570'];ctx.fillStyle=palette[(parseInt(id,10)||0)%palette.length];}
   ctx.fill(shape,'evenodd');ctx.strokeStyle='rgba(190,220,215,.88)';ctx.lineWidth=1.2;ctx.stroke(shape);
   worldHits.push({market:market||null,path:shape});
  });
  mapOverlay(overlayId,logisticsMode);
  if(status)status.textContent='国境線データ：Natural Earth 1:50m · 世界の国々を表示';
  canvas.onclick=e=>{
   const rect=canvas.getBoundingClientRect(),x=(e.clientX-rect.left)*W/rect.width,y=(e.clientY-rect.top)*H/rect.height;
   const hit=worldHits.slice().reverse().find(h=>ctx.isPointInPath(h.path,x,y));if(!hit)return;
   if(!hit.market){notify('この国はまだ経営対象外です。国・地域の市場データがまだ対応していない場所です。');return;}
   if(logisticsMode){
    if(!s.markets.includes(hit.market)){notify('この国へ先に進出してください。');return;}
    if(!s.routeFromDraft||s.routeToDraft){s.routeFromDraft=hit.market;s.routeToDraft='';}
    else if(hit.market!==s.routeFromDraft)s.routeToDraft=hit.market;
    trade();
   }else{s.selected=hit.market;show('world');}
  };
 }).catch(err=>{
  if(status)status.textContent='詳細地図を読み込めませんでした。ネット接続を確認して再読み込みしてください。';
  console.warn('WORLD EMPIRE map:',err);
 });
}

  const facilityCards=s.facilities.map(facility=>{const config=facilityTypes[facility.type]||facilityTypes.warehouse;return '<div class="listitem row"><div><b>'+config.icon+' '+config.name+' · '+esc(facility.cityName)+'</b><div class="muted">'+(countryNames[facility.country]||facility.country)+' · 維持費 '+money(config.fee)+'/日</div></div><span class="tag">稼働中</span></div>';}).join('');
  $('content').innerHTML=panel('企業拠点 · 都市を選択',
   '<div class="muted">国を選び、その国の都市を選択してから企業や物流施設を建設します。</div><label style="display:block;margin-top:12px">進出国<select id="businessCountry" style="width:100%;padding:11px;border-radius:9px;background:#12263b;border:1px solid #31536d;color:#fff">'+marketOptions+'</select></label>'+
   '<div class="row" style="margin:12px 0 7px"><b>都市を選択</b><span class="muted">'+list.length+'都市</span></div><input id="citySearch" class="country-search" type="search" placeholder="都市名で検索（東京、ロンドン、ニューヨーク…）"><div class="row" style="margin:8px 0"><span class="muted">検索結果</span><span class="muted" id="cityResultCount">'+list.length+'都市を表示</span></div><div class="country-grid" id="cityList" style="margin-top:9px"></div>'+
   '<div class="map-note">現在の選択：<b>'+(city?cityLabel(city):'未選択')+'</b> · 都市データは人口1万5千人以上の都市・集落を収録 · 位置データ：GeoNames（CC BY 4.0）</div>')+
  panel('選択した都市に事業を設立','<div class="metric"><small class="muted">建設予定地</small><b>📍 '+(city?cityLabel(city):'都市を選択してください')+'</b><div class="tag">'+(city?(countryNames[city.country]||city.country)+' · '+city.name:'')+'</div></div><div class="grid2" style="margin-top:10px">'+sectors.map((a,i)=>'<div class="card"><div style="font-size:23px">'+a.icon+'</div><b>'+a.name+'</b><div class="tag">投資額 '+money(a.cost*(countries.find(x=>x[0]===s.selected)||countries[0])[3])+' · 売上 '+money(a.income)+'/日</div><button class="btn" style="margin-top:9px" data-build="'+i+'" '+(!city?'disabled':'')+'>この都市に設立</button></div>').join('')+'</div>')+
  panel('都市インフラ · 物流拠点を建設','<div class="muted">船・飛行機・トラックの発着には、対応する物流施設が必要です。</div><div class="grid3" style="margin-top:10px">'+Object.entries(facilityTypes).map(([type,config])=>{const existing=city&&cityFacility(city,type);return '<div class="card"><div style="font-size:24px">'+config.icon+'</div><b>'+config.name+'</b><div class="tag">'+config.description+'</div><div class="tag">建設 '+money(config.cost)+'</div><button class="btn" style="margin-top:8px;width:100%" data-facility="'+type+'" '+(!city||existing?'disabled':'')+'>'+(existing?'建設済み':'建設する')+'</button></div>';}).join('')+'</div>')+
  panel('保有企業',companyCards||'<div class="muted">まだ企業がありません。</div>')+
  panel('保有物流施設',facilityCards||'<div class="muted">港・空港・倉庫はまだありません。</div>');
  renderCityChoices();
 }).catch(error=>{if(current==='business')$('content').innerHTML=panel('都市データを読み込めませんでした','接続を確認して「企業経営」を開き直してください。');console.warn(error);});
}

function market(){
 const price=s.sharePrice||100000,daily=(s.stocks[s.stocks.length-1]-s.stocks[s.stocks.length-2])/s.stocks[s.stocks.length-2]*100;
 $('content').innerHTML=panel('世界株式市場 · 自社株式 WEI','<div class="row"><div><div class="muted">WEI · 仮想株価</div><div style="font-size:31px;font-weight:850">'+money(price)+'</div></div><div class="'+(daily>=0?'positive':'negative')+'">'+(daily>=0?'▲':'▼')+' '+Math.abs(daily).toFixed(2)+'%</div></div><canvas class="chart" id="chart"></canvas><div class="grid3"><div class="metric"><small class="muted">保有株数</small><b>'+s.shares.toLocaleString()+'株</b></div><div class="metric"><small class="muted">保有株評価額</small><b>'+money(s.shares*price)+'</b></div><div class="metric"><small class="muted">企業価値</small><b>'+money(val())+'</b></div></div><div class="btnline"><button class="btn green" data-shares="buy">10株購入 · '+money(price*10)+'</button><button class="secondary" data-shares="sell" '+(s.shares<10?'disabled':'')+'>10株売却</button></div>')+
 panel('ライバル企業 · 買収と競争','<table class="table"><thead><tr><th>企業名</th><th>企業価値</th><th>操作</th></tr></thead><tbody>'+s.rivals.map((r,i)=>'<tr><td><b>'+esc(r.name)+'</b><div class="tag">'+r.sector+'</div></td><td>'+money(r.value)+'</td><td><button class="btn gold" data-acquire="'+i+'">買収 · '+money(r.value*1.2)+'</button></td></tr>').join('')+'</tbody></table><p class="muted">買収費用は推定企業価値の120%。買収企業はグループ会社になり、毎日収益を生みます。</p>');
 chart();
}
function researchView(){
 $('content').innerHTML=panel('研究開発 · 技術ツリー','<div class="muted">技術投資で会社全体の競争力を高めましょう。</div><div class="progress"><span style="width:'+s.research.length/tech.length*100+'%"></span></div>'+tech.map((t,i)=>'<div class="listitem"><div class="row"><b>🔬 '+t.name+'</b><b>'+(s.research.includes(t.id)?'<span class="positive">研究完了</span>':money(t.cost))+'</b></div><div class="muted">'+t.desc+'</div><button class="btn" style="margin-top:8px" data-tech="'+i+'" '+(s.research.includes(t.id)?'disabled':'')+'>'+(s.research.includes(t.id)?'完了':'研究に投資')+'</button></div>').join(''));
}

function routeMap(){
 return '<div class="detailed-map-wrap"><canvas id="tradeCanvas" aria-label="世界物流マップ"></canvas><svg id="tradeOverlay" viewBox="0 0 1400 650" preserveAspectRatio="none" aria-label="都市間の輸送ルートと車両"></svg></div><div class="map-status" id="tradeCanvasStatus">都市間の物流ルートを読み込んでいます…</div><div class="map-legend"><span>⚓ 港</span><span>🛫 空港</span><span>📦 倉庫</span><span>🚢 船便　✈️ 航空便　🚚 トラック</span></div>';
}
function trade(){
 $('content').innerHTML=panel('世界物流ネットワーク','港・空港・倉庫と都市データを読み込んでいます…');
 loadWorldData().then(()=>{
  if(current!=='trade')return;
  const mode=s.routeModeDraft||'ship',config=transport[mode],needed=config.facility;
  const eligible=facilitiesOfType(needed);
  const options=eligible.map(f=>'<option value="'+esc(f.id)+'">'+esc(cityJapanese[f.cityName]||f.cityName)+'（'+esc(countryNames[f.country]||f.country)+'）</option>').join('');
  const routeList=s.routes.length?s.routes.map(r=>{const cfg=transport[r.mode]||transport.ship;return '<div class="listitem"><div class="row"><b>'+cfg.icon+' '+esc(cityJapanese[r.fromCityName]||r.fromCityName||countryNames[r.from]||r.from)+' → '+esc(cityJapanese[r.toCityName]||r.toCityName||countryNames[r.to]||r.to)+'</b><b class="positive">'+money(r.income)+'/日</b></div><div class="muted">'+cfg.name+' · '+Math.round(r.distanceKm||0).toLocaleString()+' km · 所要時間：約'+r.days+'日 · 運行中</div></div>';}).join(''):'<div class="muted">物流ルートはまだありません。都市経営で港・空港・倉庫を建設しましょう。</div>';
  $('content').innerHTML=panel('世界物流ネットワーク · 都市間輸送',routeMap()+
   '<p class="muted">実際の都市座標を結び、船・飛行機・トラックが地図上のルートを移動します。ルートを作る前に、両方の都市に対応する施設を建設してください。</p>'+
   '<div class="grid3"><button class="country '+(mode==='ship'?'selected':'')+'" data-mode="ship"><div class="flag">🚢</div><b>船便</b><div class="tag">港が必要</div></button><button class="country '+(mode==='air'?'selected':'')+'" data-mode="air"><div class="flag">✈️</div><b>航空便</b><div class="tag">空港が必要</div></button><button class="country '+(mode==='land'?'selected':'')+'" data-mode="land"><div class="flag">🚚</div><b>陸路</b><div class="tag">倉庫が必要</div></button></div>'+
   '<div class="grid2" style="margin-top:12px"><label>出発地 · '+facilityTypes[needed].name+'<select id="originFacility" style="width:100%;padding:11px;border-radius:9px;background:#12263b;border:1px solid #31536d;color:#fff">'+options+'</select></label><label>目的地 · '+facilityTypes[needed].name+'<select id="destinationFacility" style="width:100%;padding:11px;border-radius:9px;background:#12263b;border:1px solid #31536d;color:#fff">'+options+'</select></label></div>'+
   '<div class="muted" style="margin-top:8px">利用可能な'+facilityTypes[needed].name+'：'+eligible.length+'か所</div>'+
   '<div class="btnline"><button class="btn green" id="createRoute" '+(eligible.length<2?'disabled':'')+'>都市間ルートを開設</button><button class="secondary" id="openBusinesses">企業経営・施設建設へ</button></div>'+
   (eligible.length<2?'<div class="notice" style="margin-top:10px">この輸送方式を使うには、異なる2都市に'+facilityTypes[needed].name+'を建設してください。</div>':'')+
   panel('運行中の物流ルート',routeList));
  drawDetailedMap('tradeCanvas','tradeOverlay',true);
 }).catch(error=>{if(current==='trade')$('content').innerHTML=panel('物流データを読み込めませんでした','接続を確認して「物流ネットワーク」を開き直してください。');console.warn(error);});
}

function ranking(){
 const all=[{name:'WORLD EMPIRE INC.',value:val(),you:true},...s.rivals.map(r=>({name:r.name,value:r.value}))].sort((a,b)=>b.value-a.value),max=all[0].value;
 $('content').innerHTML=panel('世界企業ランキング',all.map((r,i)=>'<div class="listitem row"><div style="min-width:0;flex:1"><b>#'+(i+1)+' '+esc(r.name)+(r.you?' ★':'')+'</b><div class="progress"><span style="width:'+Math.max(3,r.value/max*100)+'%"></span></div></div><b>'+money(r.value)+'</b></div>').join(''))+
 panel('企業帝国の実績','<div class="grid2"><div class="metric"><small class="muted">進出国数</small><b>'+s.markets.length+'/12</b></div><div class="metric"><small class="muted">保有企業数</small><b>'+s.businesses.length+'</b></div><div class="metric"><small class="muted">物流ルート</small><b>'+s.routes.length+'</b></div><div class="metric"><small class="muted">研究完了</small><b>'+s.research.length+'/'+tech.length+'</b></div></div>');
}
function show(view){
 current=view;
 document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
 const views={overview,world,business:businesses,market,research:researchView,trade,ranking};
 (views[view]||overview)();
}
function advance(){
 const p=businessIncome()+routeIncome()-expenses();s.profit=p;s.cash+=p;
 s.day++;if(s.day>365){s.day=1;s.year++;}
 s.economy=Math.max(12,Math.min(95,s.economy+(Math.random()-.49)*3.5));
 countries.forEach(n=>{const old=countryMood(n[0]);s.countryEconomy[n[0]]=Math.max(12,Math.min(96,old+(Math.random()-.49)*5+(s.economy-50)*.018));});
 s.rivals.forEach(r=>{const growth=(Math.random()-.43)*.018+(s.economy-50)/9000;r.value=Math.max(4e6,r.value*(1+growth));});
 const change=(Math.random()-.47)*2.4+(s.economy-50)*.025+(p/Math.max(val(),1))*180;
 s.stocks.push(Math.max(30,s.stocks[s.stocks.length-1]+change));if(s.stocks.length>40)s.stocks.shift();
 s.sharePrice=Math.max(1000,100000*s.stocks[s.stocks.length-1]/100);s.history.push(val());
 s.news='第'+s.day+'日：世界経済指数 '+s.economy.toFixed(1)+'。営業利益 '+money(p)+'。ライバル企業も投資を続けています。';
 stats();show(current);
}
function saveGame(){try{localStorage.setItem('worldEmpireSave',JSON.stringify(s));notify('ゲームを保存しました。');}catch(e){notify('保存できませんでした。');}}
function loadGame(){
 const raw=localStorage.getItem('worldEmpireSave');if(!raw){notify('セーブデータがありません。');return;}
 try{
  const loaded=JSON.parse(raw);s={...fresh(),...loaded,auto:false};
  s.countryEconomy ||= fresh().countryEconomy;s.shares ||= 0;s.sharePrice ||= 100000;s.facilities ||= [];s.selectedCityKey ||= '';
  s.businesses.forEach(b=>{b.level ||= 1;b.employees ||= 12;b.name ||= b.sector;});
  s.routes=s.routes.map(r=>({...r,mode:r.mode||'ship',income:r.income||transport.ship.income}));
  stopAuto();stats();show(current);notify('セーブデータを読み込みました。');
 }catch(e){notify('セーブデータを読み込めませんでした。');}
}
function stopAuto(){if(timer)clearInterval(timer);timer=null;$('auto').textContent='自動進行：OFF';}
$('nav').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b)show(b.dataset.view);});

$('content').addEventListener('input',e=>{
 if(e.target.id==='countrySearch'||e.target.id==='countryRegionFilter'){
  const query=($('countrySearch')?.value||'').trim().toLocaleLowerCase('ja'),region=$('countryRegionFilter')?.value||'';
  let visible=0;
  $('countryList')?.querySelectorAll('[data-country]').forEach(button=>{
   const name=countryNames[button.dataset.country]||button.dataset.country;
   const matchesName=!query||name.toLocaleLowerCase('ja').includes(query)||button.dataset.country.toLocaleLowerCase('en').includes(query);
   const matchesRegion=!region||button.dataset.region===region;
   button.hidden=!(matchesName&&matchesRegion);if(!button.hidden)visible++;
  });
  const count=$('countryResultCount');if(count)count.textContent=visible+'か国・地域';
 }
 if(e.target.id==='citySearch'){
  const query=e.target.value.trim().toLocaleLowerCase('ja'),list=getCities(s.selected);
  const matches=query?list.filter(city=>(cityLabel(city)+' '+city.name).toLocaleLowerCase('ja').includes(query)):list;
  const results=matches.slice(0,48);
  $('cityList').innerHTML=results.map(city=>'<button class="country '+(city.key===s.selectedCityKey?'selected':'')+'" data-city-key="'+esc(city.key)+'"><b>📍 '+esc(cityLabel(city))+'</b><div class="tag">'+esc(city.name)+'</div></button>').join('')||'<div class="muted">一致する都市がありません。</div>';
  const count=$('cityResultCount');if(count)count.textContent=matches.length+'都市中 '+results.length+'都市を表示';
 }
});
$('content').addEventListener('change',e=>{
 if(e.target.id==='countryRegionFilter')e.target.dispatchEvent(new Event('input',{bubbles:true}));
 if(e.target.id==='businessCountry'){s.selected=e.target.value;s.selectedCityKey='';businesses();}
});
$('content').addEventListener('click',e=>{
 const cityButton=e.target.closest('[data-city-key]');
 if(cityButton){const city=findCity(cityButton.dataset.cityKey);if(city){s.selected=city.country;s.selectedCityKey=city.key;businesses();}return;}
 const facilityButton=e.target.closest('[data-facility]');
 if(facilityButton){
  const city=ensureSelectedCity(),type=facilityButton.dataset.facility,config=facilityTypes[type];
  if(!city||!config)return;
  if(cityFacility(city,type)){notify('この都市には既に'+config.name+'があります。');return;}
  if(s.cash<config.cost){notify('建設資金が足りません。必要額：'+money(config.cost));return;}
  s.cash-=config.cost;s.facilities.push({id:city.key+'|'+type,cityKey:city.key,cityName:city.name,country:city.country,lat:city.lat,lng:city.lng,type});
  s.news=cityLabel(city)+'に'+config.name+'を建設しました。';stats();businesses();notify(config.name+'を建設しました。');return;
 }
 if(e.target.id==='openBusinesses'){show('business');return;}
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.country){s.selected=b.dataset.country;show('world');}
 else if(b.dataset.enter){
  const c=countries.find(x=>x[0]===b.dataset.enter);
  if(c&&s.cash>=c[4]){s.cash-=c[4];if(!s.markets.includes(c[0]))s.markets.push(c[0]);s.news=countryNames[c[0]]+'への進出に成功しました。';stats();show('world');}
  else notify('市場進出に必要な資金が足りません。');
 }
 else if(b.dataset.build!==undefined)build(+b.dataset.build);
 else if(b.dataset.tech!==undefined){
  const t=tech[+b.dataset.tech];if(s.cash<t.cost){notify('研究開発に必要な資金が足りません。');return;}
  s.cash-=t.cost;s.research.push(t.id);s.news='研究完了：'+t.name;stats();show('research');
 }
 else if(b.dataset.acquire!==undefined){
  const i=+b.dataset.acquire,r=s.rivals[i];if(!r)return;const cost=r.value*1.2;
  if(s.cash<cost){notify('買収に必要な資金が足りません。');return;}
  s.cash-=cost;s.businesses.push({name:r.name+' 子会社',sector:r.sector,icon:'🏢',country:'Global',cost,income:Math.max(70000,r.value*.009),level:1,employees:30});
  s.news=r.name+'の買収が完了しました。';s.rivals.splice(i,1);stats();show('market');
 }
 else if(b.dataset.upgradeBusiness!==undefined){
  const x=s.businesses[+b.dataset.upgradeBusiness];if(!x)return;const cost=Math.max(500000,x.cost*.35*(x.level||1));
  if(s.cash<cost){notify('強化に必要な資金が足りません。');return;}
  s.cash-=cost;x.level=(x.level||1)+1;x.employees=(x.employees||12)+8;x.cost+=cost;x.income*=1.22;stats();show('business');
 }
 else if(b.dataset.closeBusiness!==undefined){
  const i=+b.dataset.closeBusiness,x=s.businesses[i];if(!x)return;
  s.cash+=x.cost*.5;s.businesses.splice(i,1);stats();show('business');notify('事業を売却しました。');
 }
 else if(b.dataset.shares){
  const price=s.sharePrice||100000;
  if(b.dataset.shares==='buy'){const cost=price*10;if(s.cash<cost){notify('株式を購入する資金が足りません。');return;}s.cash-=cost;s.shares+=10;notify('10株購入しました。');}
  else{if(s.shares<10)return;s.cash+=price*10;s.shares-=10;notify('10株売却しました。');}
  stats();show('market');
 }
 else if(b.dataset.mode){s.routeModeDraft=b.dataset.mode;trade();}
 else if(b.id==='resetRouteDraft'){s.routeFromDraft='';s.routeToDraft='';trade();}
 else if(b.id==='createRoute'){
  const mode=s.routeModeDraft||'ship',cfg=transport[mode];
  const origin=facilitiesOfType(cfg.facility).find(f=>f.id===$('originFacility')?.value);
  const destination=facilitiesOfType(cfg.facility).find(f=>f.id===$('destinationFacility')?.value);
  if(!origin||!destination){notify('出発地と目的地の両方に'+facilityTypes[cfg.facility].name+'が必要です。');return;}
  if(origin.id===destination.id){notify('異なる都市を選択してください。');return;}
  if(mode==='land'&&origin.country!==destination.country&&!areCountriesAdjacent(origin.country,destination.country)){notify('陸路は隣接する国同士でのみ開設できます。');return;}
  if(s.routes.some(r=>r.fromFacilityId===origin.id&&r.toFacilityId===destination.id&&r.mode===mode)){notify('同じ物流ルートがすでにあります。');return;}
  if(s.cash<cfg.cost){notify('開設に必要な資金が足りません。');return;}
  const distance=cityDistanceKm({lat:origin.lat,lng:origin.lng},{lat:destination.lat,lng:destination.lng});
  const speed=mode==='air'?700:mode==='ship'?600:450;
  const transitDays=Math.max(cfg.days,Math.ceil(distance/speed));
  const distanceFactor=Math.max(.65,Math.min(2.8,distance/1800));
  s.cash-=cfg.cost;
  s.routes.push({from:origin.country,to:destination.country,fromCityName:origin.cityName,toCityName:destination.cityName,fromFacilityId:origin.id,toFacilityId:destination.id,fromLat:origin.lat,fromLng:origin.lng,toLat:destination.lat,toLng:destination.lng,mode,distanceKm:distance,days:transitDays,income:cfg.income*distanceFactor*(s.research.includes('globalLogistics')?1.4:1)});
  s.news=origin.cityName+'から'+destination.cityName+'への'+cfg.name+'ルートを開設しました。';
  stats();show('trade');notify('都市間物流ルートを開設しました！地図上で車両が走り始めます。');
 }
});
$('advance').onclick=advance;
$('auto').onclick=()=>{if(timer){stopAuto();}else{timer=setInterval(advance,1800);$('auto').textContent='自動進行：ON';}};
$('save').onclick=saveGame;$('load').onclick=loadGame;
$('reset').onclick=()=>{if(confirm('新しい会社を設立しますか？保存していない進行状況は失われます。')){stopAuto();s=fresh();stats();show('overview');notify('新しい企業帝国が始まります。');}};
stats();show('overview');
})();
</script></body></html>
